name: Build & Release

on:
  push:
    branches:
      - main
      - feature/**
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamedMountables-Plus
          path: bin/TamedMountables-Plus.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: TamedMountables-Plus

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tamed Mountables Plus ${{ steps.version.outputs.tag }}
          files: TamedMountables-Plus.zip
          fail_on_unmatched_files: true
