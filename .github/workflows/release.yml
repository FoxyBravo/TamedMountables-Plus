name: Build & Release

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamedMountables-Plus
          path: bin/TamedMountables-Plus.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.version' resources/modinfo.json)"
          tag="v$version"
          gh release delete "$tag" --yes 2>/dev/null || true
          git push --delete origin "$tag" 2>/dev/null || true
          gh release create "$tag" "bin/TamedMountables-Plus.zip" \
            --title "Tamed Mountables Plus $tag" \
            --generate-notes
